[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/e2b-dev/e2b-rs"
authors = ["E2B"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.dependencies]
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
regress = "0.10"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls", "webpki-roots"] }
futures = "0.3"
async-stream = "0.3"
semver = "1"
wiremock = "0.6"
